<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140b26">
<title>생일 퀘스트 — 세 개의 문</title>
<link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
:root{--bg:#140b26;--panel:#241546;--edge:#4a2d7d;--gold:#ffcb3d;--pink:#ff4d8d;--cyan:#5fe3ff;--cream:#fdf6e3;--dim:#9b86c9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:"Galmuri11","DungGeunMo",monospace;
 display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;
 overscroll-behavior:none;position:fixed;inset:0;touch-action:manipulation}
#app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;
 padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));gap:7px}
.frame{position:relative;border:3px solid var(--edge);background:#0d0619;
 box-shadow:0 0 0 3px #0d0619,0 6px 0 3px #2a1a4d;overflow:hidden;flex:0 0 auto;
 width:min(100%,calc(41dvh * 4 / 3));margin:0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
.scan{position:absolute;inset:0;pointer-events:none;
 background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px 8px rgba(10,3,25,.85)}
#banner{position:absolute;left:50%;top:19%;transform:translateX(-50%);z-index:2;
 font-size:19px;color:var(--gold);white-space:nowrap;letter-spacing:1px;display:none;
 pointer-events:none;line-height:1;
 text-shadow:2px 2px 0 #0d0619,-2px 2px 0 #0d0619,2px -2px 0 #0d0619,-2px -2px 0 #0d0619,
              0 3px 0 #b52a5f}
#photo{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
 width:94%;height:auto;max-height:78%;object-fit:contain;display:none;
 border:2px solid var(--cream);box-shadow:0 0 0 2px #0d0619,0 3px 0 2px #2a1a4d;
 pointer-events:none;z-index:1;image-rendering:auto}
#tag{position:absolute;pointer-events:none;font-size:11px;color:var(--cream);white-space:nowrap;
 transform:translate(-50%,-100%);line-height:1;opacity:0;transition:opacity .18s;z-index:2;
 text-shadow:1px 1px 0 #0d0619,-1px 1px 0 #0d0619,1px -1px 0 #0d0619,-1px -1px 0 #0d0619}
#tag.on{opacity:1}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
 padding:6px 8px;font-size:10px;color:var(--cyan);text-shadow:1px 1px 0 #0d0619;pointer-events:none}
#sound{pointer-events:auto;background:none;border:0;color:var(--cyan);font:inherit;font-size:10px;padding:2px 4px;cursor:pointer}
.box{border:3px solid var(--cream);background:var(--panel);box-shadow:0 0 0 3px #0d0619;padding:10px 12px 8px}
#panel{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
#labelrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
#label{font-size:10px;color:var(--gold);letter-spacing:1px}
#text{font-size:12.5px;line-height:1.55;flex:1;overflow-y:auto}
#text .hl{color:var(--pink)}
#text .yr{color:var(--cyan)}
#text.tight{font-size:11.2px;line-height:1.45}
#text.tiny{font-size:10.2px;line-height:1.4}
#text.micro{font-size:9.2px;line-height:1.35}

function blit(map,ox,oy,s,pal){
  pal = pal||PAL;
  for(let y=0;y<map.length;y++){
    const row=map[y];
    for(let x=0;x<row.length;x++){
      const c=pal[row[x]]; if(!c) continue;
      ctx.fillStyle=c; ctx.fillRect(Math.round(ox+x*s),Math.round(oy+y*s),s,s);
    }
  }
}
function mask(map,ox,oy,s,col){
  ctx.fillStyle=col;
  for(let y=0;y<map.length;y++)
    for(let x=0;x<map[y].length;x++)
      if(map[y][x]==='1') ctx.fillRect(Math.round(ox+x*s),Math.round(oy+y*s),s,s);
}
function num(str,ox,oy,s,col){
  let x=ox;
  for(const ch of String(str)){
    if(DIGITS[ch]) mask(DIGITS[ch],x,oy,s,col);
    x += (ch==='.') ? 2*s : 4*s;
  }
  return x-s;
}
function fitScale(str,maxW,sizes){
  for(const s of sizes) if(numW(str,s)<=maxW) return s;
  return sizes[sizes.length-1];
}
function numW(str,s){
  let w=0; for(const ch of String(str)) w += (ch==='.') ? 2*s : 4*s;
  return w-s;
}

let ac=null, sound=true;
function ensureAudio(){ if(!ac && sound){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } }
function tone(f,dur,when=0,type='square',vol=.06){
  if(!sound) return; ensureAudio(); if(!ac) return;
  const t=ac.currentTime+when, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}
const blip=()=>tone(520,.06);
const step=()=>tone(180,.03,0,'square',.03);
const tear=()=>{tone(300,.05);tone(220,.06,.05);};
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,i*.07));
const puff=()=>tone(120,.3,0,'sawtooth',.05);

const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],

const BEAT=.32;
const PHRASE=[0,6,12,19,25], SONGBEATS=25;
function sing(){
  clearInterval(typer); typer=null;
  const lines=(cfg.song&&cfg.song.length)?cfg.song:['생일 축하합니다'];
  const times = lines.length<=PHRASE.length
    ? lines.map((_,i)=>PHRASE[i]*BEAT*1000)
    : lines.map((_,i)=>i*SONGBEATS/lines.length*BEAT*1000);
  elLabel.textContent='♪ 생일 축하 노래';
  const render=k=>{
    elText.innerHTML=lines.map((l,i)=>{
      const cls = i===k ? 'hl' : (i<k ? 'fade' : '');
      const mark = i===k ? '♪&nbsp;' : '&nbsp;&nbsp;&nbsp;';
      return '<span class="'+cls+'">'+mark+l+'</span>';
    }).join('<br>');
  };
  fitText(lines.join('\n'));
  render(-1);
  lines.forEach((l,i)=>setTimeout(()=>{
    if(!(S.screen==='r2' && S.lit && !S.blown)) return;
    render(i);
    if(times[i] >= SONGBEATS*BEAT*1000 - 1){
      chime();
      burst(80,52,26,['#ffcb3d','#ff4d8d','#5fe3ff','#fdf6e3'],140);
    }
  }, times[i]));
  return times[times.length-1];
}
function playSong(){
  let t=0;
  SONG.forEach(([f,b])=>{ tone(f,b*BEAT*.85,t,'square',.055); tone(f/2,b*BEAT*.85,t,'triangle',.03); t+=b*BEAT; });
  return t*1000;
}

let typer=null;
function type(str,done){
  clearInterval(typer);
  const html=str.replace(/\n/g,'<br>'); let i=0;
  elText.innerHTML=''; cue('▲ 화면을 탭하면 바로 보기','dim');
  typer=setInterval(()=>{
    i++; let cut=html.slice(0,i);
    const lt=cut.lastIndexOf('<'); if(lt>cut.lastIndexOf('>')) cut=cut.slice(0,lt);
    elText.innerHTML=cut; elText.scrollTop=elText.scrollHeight;
    if(i%4===0) tone(720,.02,0,'square',.018);
    if(i>=html.length){ clearInterval(typer); typer=null; done&&done(); }
  },20);
}
const SIZES=['','tight','tiny','micro'];
function fitText(html){
  const keep=elText.innerHTML;
  const room=$('panel').clientHeight - $('labelrow').offsetHeight - $('cue').offsetHeight - 10;
  elText.innerHTML=String(html).split('\n').join('<br>');
  let cls='';
  for(const c of SIZES){
    elText.className=c;
    cls=c;
    if(room<=0 || elText.scrollHeight<=room) break;
  }
  elText.innerHTML=keep; elText.className=cls;
  return cls;
}
function say(label,str,after){
  fitText(str);
  elLabel.textContent=label; S.pending=str; S.after=after; type(str,after);
}
function skipType(){
  if(!typer) return false;
  clearInterval(typer); typer=null;
  elText.innerHTML=S.pending.replace(/\n/g,'<br>'); elText.scrollTop=0;
  S.after&&S.after(); return true;
}
function cue(txt,mode){            // mode: 'on'(입력 필요) | 'dim'(대기) | 'off'

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); ensureAudio();
  const r=cv.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*W;

  if(S.screen==='title'){ goHub(); return; }

  if(S.screen==='hub'){
    if(S.cleared.every(Boolean)){ ending(); return; }
    for(let i=0;i<3;i++){
      if(!S.cleared[i] && mx>=DOORX[i]-4 && mx<=DOORX[i]+36){
        S.hero.tx=DOORC[i]-5; S.hero.going=i; return;
      }
    }
    return;
  }

  if(S.screen==='r1'){
    if(skipType()) return;
    if(S.phase==='tear'){
      const r0=cfg.records[S.page];
      S.pages.push({x:38,y:20,vx:(Math.random()-.5)*50,vy:-40,a:0,va:(Math.random()-.5)*6,year:r0.big});
      S.page++; tear(); showRecord();
    } else if(S.phase==='last'){ startDol(); }
    else if(S.phase==='dolpick'){
      for(let i=0;i<DOLX.length;i++)
        if(mx>=DOLX[i] && mx<=DOLX[i]+32){ pickDol(i); return; }
    }
    else if(S.phase==='done'){ clearDoor(0); }
    return;
  }

  if(S.screen==='r2'){
    if(skipType()) return;
    if(!S.lit){
      S.lit=true;
      const ms=playSong(), lastLine=sing();
      cue('♪ 노래가 끝날 때까지 잠시만','dim');
      setTimeout(()=>{ if(S.screen==='r2'){ S.phase='blow';
        say('소원 기안함', fillTpl(cfg.wish),
            ()=>wait('▲ 화면을 탭하면 재가 · 촛불 끄기')); } }, Math.max(ms,lastLine)+1900);
    } else if(S.phase==='blow'){
      S.blown=true; S.phase='done'; puff();
      for(let i=0;i<14;i++) S.parts.push({x:74+Math.random()*14,y:34,vx:(Math.random()-.5)*24,
        vy:-20-Math.random()*20,c:'#9b86c9',life:1.4,g:-10});
      burst(80,50,22,['#ffcb3d','#ff4d8d','#5fe3ff','#fdf6e3'],120);
      say('재가 완료','촛불이 꺼졌습니다.\n소원은 원안대로 시행됩니다.\n올해도 좋은 일만 있기를.',
          ()=>wait('▼ 화면을 탭하면 복도로'));
    } else if(S.phase==='done'){ clearDoor(1); }
    return;
  }

  if(S.screen==='r3'){
    if(skipType()) return;
    if(S.phase==='done') clearDoor(2);
    return;
  }
});

function drawCake(cx,bottom,s,lit){
  const w=16*s,h=CAKE.length*s, top=bottom-h;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(cx-w/2+4,bottom-2,w-8,4);
  blit(CAKE,cx-w/2,top,s);
  const chars=[...String(cfg.candles||'').replace(/[\uFE0F\s]/g,'')]
              .filter(c=>DIGITS[c]||'♥❤♡'.includes(c));
  if(!chars.length) return;
  const cs=Math.max(2,s-1), dW=3*cs, hW=7*cs, gap=cs+1;
  let total=-gap;
  chars.forEach(c=> total += ('♥❤♡'.includes(c)?hW:dW)+gap);
  let x=Math.round(cx-total/2); const base=top-2;
  chars.forEach((c,i)=>{
    if('♥❤♡'.includes(c)){
      const pulse=Math.sin(S.t*3+i)*.5+.5;
      mask(HEART,x,base-7*cs,cs,pulse>.5?'#ff4d8d':'#ff81ae'); x+=hW+gap;
    }else{
      const top2=base-5*cs;
      mask(DIGITS[c],x,top2,cs,'#fdf6e3');
      if(lit){
        const fl=Math.sin(S.t*9+i*2)>0?0:1, fx=x+cs, fy=top2-4*cs-2-fl;
        ctx.fillStyle='rgba(255,203,61,.2)'; ctx.fillRect(fx-cs,fy-1,5*cs,6*cs);
        mask(FLAME,fx,fy,cs,'#ff8a3d');
        ctx.fillStyle='#ffe27a'; ctx.fillRect(fx+cs,fy+cs,cs,cs*2);
      }else{
        ctx.fillStyle='#6b5a3a'; ctx.fillRect(x+cs,top2-cs,cs,cs);
      }
      x+=dW+gap;
    }
  });
}

function drawBunting(){
  const col=['#ffcb3d','#ff4d8d','#5fe3ff','#fdf6e3'];
  ctx.fillStyle='#6d4fa8';
  for(let x=0;x<W;x++) ctx.fillRect(x, 2+Math.sin(x/W*Math.PI)*7, 1, 1);
  for(let f=0;f<11;f++){
    const fx=f*15+2, sy=Math.round(3+Math.sin(fx/W*Math.PI)*7);
    ctx.fillStyle=col[f%4];
    for(let i=0;i<9;i++) ctx.fillRect(fx+Math.floor(i*.5), sy+i, 9-i, 1);
  }
}
function drawNote(){
  const x=26,y=10,w=108,h=80;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(x+3,y+3,w,h);
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#fdf6e3'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(x,y,w,9);
  ctx.fillStyle='#9b86c9'; for(let i=0;i<w-16;i+=4) ctx.fillRect(x+8+i,y+3,2,1);
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(x,y+14,w,1);
  ctx.fillStyle='#c9b8e0';
  for(let i=0;i<7;i++) ctx.fillRect(x+8,y+22+i*7,(i<4?w-42:w-24),1);
  const gx=x+74, gy=y+18, gw=28, gh=24;
  const pulse=(Math.sin(S.t*2.2)+1)/2;
  ctx.fillStyle=`rgba(255,203,61,${.10+pulse*.22})`;
  ctx.fillRect(gx-3,gy-3,gw+6,gh+6);
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(gx,gy,gw,gh);
  ctx.fillStyle='#fdf6e3'; ctx.fillRect(gx+2,gy+2,gw-4,gh-4);
  ctx.fillStyle='#c9b8e0'; ctx.fillRect(gx+5,gy+5,gw-10,1);
  num('S+', gx+gw/2-numW('S+',3)/2, gy+8, 3, '#e0554f');
  const cx=x+w-17, cy=y+h-17;
  ctx.fillStyle='#e0554f';
  for(let a=0;a<360;a+=7){
    const rad=a*Math.PI/180;
    ctx.fillRect(Math.round(cx+Math.cos(rad)*10), Math.round(cy+Math.sin(rad)*10), 2, 2);
  }
  ctx.fillRect(cx-5,cy-1,11,2); ctx.fillRect(cx-1,cy-6,2,13);
  ctx.fillRect(cx-5,cy-6,2,3); ctx.fillRect(cx+4,cy-6,2,3);
}
function drawCalendar(){
  const x=40,y=18,w=80,h=64;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(x+3,y+3,w,h);
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#ff4d8d'; ctx.fillRect(x,y,w,14);
  ctx.fillStyle='#fdf6e3'; ctx.fillRect(x,y+14,w,h-14);
  ctx.fillStyle='#2a1a4d';
  ctx.fillRect(x+18,y-4,3,8); ctx.fillRect(x+w-21,y-4,3,8);
  ctx.fillRect(x,y+14,w,1);
  const r=cfg.records[S.page];
  if(r){
    const bs=fitScale(r.big,w-10,[4,3,2]);
    const by=(r.sub?y+24:y+30)+(20-5*bs)/2;
    num(r.big, x+w/2-numW(r.big,bs)/2, by, bs, '#2a1a4d');
    if(r.sub){
      const ss=fitScale(r.sub,w-10,[3,2]);
      num(r.sub, x+w/2-numW(r.sub,ss)/2, y+48, ss, '#b52a5f');
    }else{
      ctx.fillStyle='#e3d6f5'; ctx.fillRect(x+16,y+54,w-32,1);
      ctx.fillStyle='#c9b8e0'; ctx.fillRect(x+14,y+56,w-28,1);
    }
  }
}

/* ─── 루프 ─────────────────────────── */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05); last=now; S.t+=dt;
  ctx.fillStyle='#140b26'; ctx.fillRect(0,0,W,H);
  S.stars.forEach(s=>{ const tw=Math.sin(S.t*2+s.p)*.5+.5;
    ctx.fillStyle=tw>.55?'#6d4fa8':'#3a2568'; ctx.fillRect(s.x|0,s.y|0,1,1); });
  ctx.fillStyle='#2a1a4d'; ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle='#3a2568'; ctx.fillRect(0,FLOOR,W,1);

  if(S.screen==='title'){
    drawBunting();
    BALLOONS.forEach(b=>{
      const y=30+Math.sin(S.t*1.1+b.p)*5;
      blit(BALLOON,b.x,y,2,{b:b.c,w:'#fdf6e3',s:'#7a63b0'});
    });
    drawCake(84,94,3,true);
    drawHero(30,FLOOR,false);
    if(Math.random()<.25){
      const sx=Math.random()*W, sy=40+Math.random()*40;
      S.parts.push({x:sx,y:sy,vx:0,vy:-6,c:'#fdf6e3',life:.7,g:0});
    }
  }

  if(S.screen==='hub'){
    for(let i=0;i<3;i++){
      blit(DOOR,DOORX[i],DOORY,2,DOOR_PAL(i));
      const lab=String(i+1);
      num(lab, DOORC[i]-numW(lab,2)/2, DOORY-12, 2, S.cleared[i]?'#5a4a80':'#fdf6e3');
      if(S.cleared[i]) mask(CHECK,DOORC[i]-5,DOORY+14,2,'#5fe3ff');
    }
    const hx=S.hero;
    if(Math.abs(hx.x-hx.tx)>1){
      const d=Math.sign(hx.tx-hx.x); hx.dir=d; hx.x+=d*46*dt; hx.walk+=dt*10;
      if((hx.walk|0)%2===0 && Math.random()<.12) step();
    } else if(hx.going>=0 && hx.going<3){ const g=hx.going; hx.going=-1; enter(g); }
    drawHero(S.hero.x,FLOOR,Math.abs(hx.x-hx.tx)>1);
  }

  if(S.screen==='r1' && S.dol){
    ctx.fillStyle='#3a1a3d'; ctx.fillRect(0,78,W,FLOOR-78);
    ctx.fillStyle='#b52a5f'; ctx.fillRect(0,74,W,4);
    ctx.fillStyle='#ff81ae'; ctx.fillRect(0,74,W,1);
    if(S.pick>=0) S.pickY += (18-S.pickY)*Math.min(1,dt*4);
    DOLMAP.forEach((m,i)=>{
      if(S.pick>=0){
        if(i!==S.pick) return;
        blit(m,48,S.pickY,4,DPAL);
        return;
      }
      const y=44+Math.sin(S.t*2.2+i)*1.5;
      ctx.fillStyle='#7a1a3d'; ctx.fillRect(DOLX[i]+5,75,22,3);
      ctx.fillStyle='#d94a7e'; ctx.fillRect(DOLX[i]+5,74,22,1);
      blit(m,DOLX[i],y,2,DPAL);
    });
    if(S.pick<0 && Math.floor(S.t*2)%2===0){
      ctx.fillStyle='#5fe3ff';
      DOLX.forEach(x=>ctx.fillRect(x+14,40,4,2));
    }
  }
  else if(S.screen==='r1'){
    if(S.page===0){
      for(let i=3;i>=0;i--){
        ctx.fillStyle=`rgba(255,203,61,${0.05-i*0.011})`;
        ctx.fillRect(36-i*5,14-i*5,88+i*10,72+i*10);
      }
      [[8,'#ff4d8d',0],[136,'#5fe3ff',2.4]].forEach(([bx,bc,ph])=>
        blit(BALLOON,bx,24+Math.sin(S.t*1.2+ph)*5,2,{b:bc,w:'#fdf6e3',s:'#7a63b0'}));
      SPARK.forEach((q,i)=>{
        const k=(Math.sin(S.t*2.6+i*1.7)+1)/2;
        if(k>.55){
          ctx.fillStyle = k>.85 ? '#fdf6e3' : '#ffcb3d';
          ctx.fillRect(q[0],q[1]-2,1,5); ctx.fillRect(q[0]-2,q[1],5,1);
        }
      });
    }
    (cfg.records[S.page]||{}).kind==='note' ? drawNote() : drawCalendar();
    S.pages=S.pages.filter(p=>{
      p.vy+=340*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=p.va*dt;
      if(p.y>150) return false;
      ctx.save(); ctx.translate(p.x+40,p.y+32); ctx.rotate(p.a);
      ctx.fillStyle='#fdf6e3'; ctx.fillRect(-40,-25,80,50);
      const ps=fitScale(p.year,74,[3,2]);
      num(p.year,-numW(p.year,ps)/2,-8,ps,'#9b86c9'); ctx.restore(); return true;
    });
    drawHero(24,FLOOR,false);
  }

  if(S.screen==='r2'){
    drawCake(80,92,4,S.lit&&!S.blown);
    if(S.lit&&!S.blown&&Math.random()<.14)
      S.notes.push({x:100+Math.random()*30,y:80,vy:-16-Math.random()*10,p:Math.random()*6});
    S.notes=S.notes.filter(n=>{
      n.y+=n.vy*dt;
      ctx.save(); mask(NOTE,n.x+Math.sin(S.t*3+n.p)*3,n.y,2,'#5fe3ff'); ctx.restore();
      return n.y>-8;
    });
    drawHero(22,FLOOR,false);
  }

  if(S.screen==='r3'){
    if(!cfg.photo){
      const x=48,y=14;
      ctx.fillStyle='#241546'; ctx.fillRect(x,y,64,48);
      ctx.fillStyle='#4a2d7d';
      for(let i=0;i<64;i+=6) ctx.fillRect(x+i,y,3,1), ctx.fillRect(x+i,y+47,3,1);
      for(let i=0;i<48;i+=6) ctx.fillRect(x,y+i,1,3), ctx.fillRect(x+63,y+i,1,3);
      mask(HEART,x+25,y+18,2,'#4a2d7d');
      drawHero(22,FLOOR,false);
    } else {
      for(let i=3;i>=0;i--){
        ctx.fillStyle=`rgba(255,203,61,${0.06-i*0.013})`;
        ctx.fillRect(4-i*3,16-i*3,152+i*6,80+i*6);
      }
      ctx.fillStyle='#5fe3ff';
      ctx.fillRect(34,14,26,5); ctx.fillRect(100,14,26,5);
      ctx.fillStyle='#9be9ff'; ctx.fillRect(34,14,26,1); ctx.fillRect(100,14,26,1);
      SPARK.filter(q=>q[1]<14||q[1]>100).forEach((q,i)=>{
        const k=(Math.sin(S.t*2.4+i*1.9)+1)/2;
        if(k>.6){ ctx.fillStyle = k>.85?'#fdf6e3':'#ffcb3d';
          ctx.fillRect(q[0],q[1]-2,1,5); ctx.fillRect(q[0]-2,q[1],5,1); }
      });
    }
  }

  if(S.screen==='ending'){
    drawCake(96,94,3,true);
    const bob=Math.abs(Math.sin(S.t*4))*4;
    drawHero(S.hero.x,FLOOR-bob,true);
  }

  S.parts=S.parts.filter(p=>{
    p.vy+=(p.g||240)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt*1.1;
    if(p.life<=0) return false;
    ctx.fillStyle=p.c; ctx.fillRect(p.x|0,p.y|0,2,2); return true;
  });
  S.conf.forEach(c=>{
    c.y+=c.vy*dt; c.x+=Math.sin(S.t*3+c.y*.1)*.3+c.vx*dt;
    if(c.y>H){ c.y=-4; c.x=Math.random()*W; }
    ctx.fillStyle=c.c; ctx.fillRect(c.x|0,c.y|0,2,3);
  });
  const tg=$('tag');
  if(S.tagOn){ tg.style.left=(S.tagX/W*100).toFixed(2)+'%'; tg.style.top=(S.tagY/H*100).toFixed(2)+'%';
               tg.classList.add('on'); } else tg.classList.remove('on');
  S.tagOn=false;
  if(S.flash>0){ ctx.fillStyle=`rgba(253,246,227,${S.flash*.45})`; ctx.fillRect(0,0,W,H); S.flash-=dt*3; }
  requestAnimationFrame(frame);
}
function drawHero(x,groundY,walking){
  const map = walking && (Math.floor(S.t*8)%2===0) ? HERO_B : HERO_A;
  const s=2, w=map[0].length*s, h=map.length*s;
  S.tagOn=true; S.tagX=x; S.tagY=groundY-h-2;
  ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(x-w/2+3,FLOOR-2,w-6,3);
  ctx.save();
  if(S.hero.dir<0 && S.screen==='hub'){ ctx.translate(x,0); ctx.scale(-1,1); ctx.translate(-x,0); }
  blit(map,x-w/2,groundY-h,s,CPAL);
  ctx.restore();
}
goTitle();
requestAnimationFrame(frame);
</script>
