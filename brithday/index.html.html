<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>생일 퀘스트</title>
<link href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#140b26}
body{color:#fdf6e3;font-family:Galmuri11,monospace;overscroll-behavior:none;
 -webkit-text-size-adjust:100%}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:340px;text-align:center;
 border:3px solid #4a2d7d;background:#1b0f33;padding:26px 20px;
 box-shadow:0 0 0 3px #0d0619, 0 6px 0 3px #2a1a4d}
h1{font-size:17px;color:#ffcb3d;letter-spacing:2px;margin-bottom:6px;line-height:1.5;
 text-shadow:2px 2px 0 #0d0619}
.sub{font-size:11px;color:#9b86c9;line-height:1.7;margin-bottom:20px}
.lock{font-size:30px;margin-bottom:12px;line-height:1}
input{width:100%;font:inherit;font-size:16px;text-align:center;letter-spacing:2px;
 color:#fdf6e3;background:#241546;border:3px solid #4a2d7d;padding:12px 8px;
 outline:none;margin-bottom:12px}
input:focus{border-color:#5fe3ff}
button{width:100%;font:inherit;font-size:14px;padding:13px;border:0;cursor:pointer;
 background:#ffcb3d;color:#1b0f33;letter-spacing:2px}
button:disabled{background:#4a2d7d;color:#9b86c9;cursor:default}
.msg{font-size:11px;color:#ff4d8d;margin-top:12px;min-height:16px;line-height:1.6}
.msg.ok{color:#5fe3ff}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#140b26}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
 75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
</style>
</head>
<body>
<div id="gate">
  <div class="box" id="box">
    <div class="lock">🔒</div>
    <h1>생일 퀘스트</h1>
    <p class="sub">비밀번호를 입력하세요</p>
    <input id="pw" type="password" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" maxlength="64">
    <button id="go">열기</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

      'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,
      {name:'AES-GCM',length:256},false,['decrypt']);
    html=new TextDecoder().decode(
      await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
  }catch(e){
    $('go').disabled=false;
    fail('비밀번호가 맞지 않습니다');
    $('box').classList.add('shake');
    setTimeout(()=>$('box').classList.remove('shake'),320);
    $('pw').value=''; $('pw').focus();
    return;
  }
  const f=$('game');
  f.onload=()=>{ $('gate').style.display='none'; f.style.display='block'; };
  try{
    f.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  }catch(e){
    f.srcdoc=html;
  }
  setTimeout(()=>{ if(f.style.display!=='block'){
    $('gate').style.display='none'; f.style.display='block'; } }, 1500);
}
function fail(t){ $('msg').className='msg'; $('msg').textContent=t; }
$('go').addEventListener('click',open_);
$('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') open_(); });
window.addEventListener('load',()=>$('pw').focus());
</script>
</body>
</html>
